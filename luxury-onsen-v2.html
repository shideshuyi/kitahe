<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<title>ひとりで泊まれる高級温泉宿（全国版・試作v2）</title>
<style>
  :root{
    --ink: #0a0a0a;
    --ink-soft: #4a4a4a;
    --mist: #8a8a8a;
    --paper: #ffffff;
    --paper-deep: #f7f7f7;
    --line: #1a1a1a;
    --line-soft: #d8d8d8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    padding:0 0 80px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:840px;margin:0 auto; padding:0 20px;}

  header.cover{
    padding:28px 0 40px;
    margin:0 0 36px;
    border-bottom:3px solid var(--ink);
  }
  header.cover .wrap{
    padding-top:18px;
    border-top:1px solid var(--ink);
  }
  h1{
    margin:0 0 8px;
    font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
    font-weight:700;
    font-size:2.4rem;
    letter-spacing:.02em;
    line-height:1.3;
    color:var(--ink);
  }
  h1 small{
    display:block;
    font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    font-size:.72rem;
    color:var(--ink);
    letter-spacing:.22em;
    margin-bottom:16px;
    font-weight:700;
    text-transform:uppercase;
  }
  .purpose{
    font-size:.85rem;
    line-height:1.8;
    color:var(--ink-soft);
    max-width:520px;
  }

  section.panel{
    background:var(--paper);
    border:1px solid var(--line);
    padding:28px 30px;
    margin-bottom:28px;
  }
  .panel h2{
    font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
    font-weight:700;
    font-size:1.15rem;
    letter-spacing:.02em;
    color:var(--ink);
    margin:0 0 20px;
    padding-bottom:14px;
    border-bottom:2px solid var(--ink);
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:18px 22px;
  }
  label{
    display:block;
    font-size:.68rem;
    color:var(--mist);
    letter-spacing:.06em;
    margin-bottom:7px;
    text-transform:uppercase;
  }
  input[type=text],input[type=date],select{
    width:100%;
    font-family:"Zen Kaku Gothic New",sans-serif;
    font-size:.88rem;
    padding:9px 2px;
    border:none;
    border-bottom:1.5px solid var(--ink);
    background:transparent;
    color:var(--ink);
    border-radius:0;
    transition:border-color .15s ease;
  }
  input[type=text]:focus,input[type=date]:focus,select:focus{
    outline:none;
    border-bottom-width:2.5px;
  }
  .checkrow{
    display:flex; align-items:center; gap:8px;
    font-size:.78rem; color:var(--ink-soft);
    margin-top:4px;
  }
  .actions{margin-top:26px; display:flex; align-items:center; gap:18px; flex-wrap:wrap;}
  button{
    font-family:"Zen Kaku Gothic New",sans-serif;
    font-size:.8rem;
    font-weight:700;
    padding:13px 34px;
    background:var(--ink);
    color:var(--paper);
    border:1.5px solid var(--ink);
    letter-spacing:.12em;
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  button:hover{background:var(--paper); color:var(--ink);}
  button:disabled{background:var(--line-soft); border-color:var(--line-soft); color:#fff; cursor:default;}
  .status{
    font-size:.78rem; color:var(--mist);
  }
  .status.err{color:var(--ink); font-weight:700;}
  .status.loading{
    color:var(--ink);
    font-weight:700;
    font-size:.85rem;
    animation: pulse 1.3s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:1;}
    50%{opacity:.35;}
  }

  .legend{
    font-size:.74rem;
    color:var(--ink-soft);
    line-height:2;
  }
  .legend b{color:var(--ink);font-weight:700;}

  table{
    width:100%;
    border-collapse:collapse;
    font-size:.86rem;
    background:transparent;
  }
  thead th{
    text-align:left;
    font-size:.68rem;
    font-weight:700;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink);
    padding:0 10px 14px;
    border-bottom:2.5px solid var(--ink);
  }
  tbody td{
    padding:20px 10px;
    border-bottom:1px solid var(--line-soft);
    vertical-align:top;
  }
  tbody tr:hover{background:var(--paper-deep);}
  .hname{font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif; font-weight:700; font-size:1.08rem; color:var(--ink);}
  .hname a{color:inherit; text-decoration:none; border-bottom:1.5px solid transparent; padding-bottom:2px; transition:border-color .15s ease;}
  .hname a:hover{border-bottom-color:var(--ink);}
  .plan{font-size:.74rem; color:var(--mist); margin-top:4px;}
  .num{
    font-variant-numeric:tabular-nums;
    text-align:right;
    white-space:nowrap;
  }
  .badge{
    display:inline-block;
    font-size:.68rem;
    padding:3px 9px;
    border:1px solid var(--ink);
    color:var(--ink);
    white-space:nowrap;
  }
  .empty{
    padding:56px 20px; text-align:center;
    color:var(--mist); font-size:.85rem;
    border:1px solid var(--line-soft);
  }

  details.advanced{
    margin-top:16px;
    border-top:1px solid var(--line-soft);
    padding-top:16px;
  }
  details.advanced summary{
    cursor:pointer;
    font-size:.72rem;
    color:var(--ink);
    letter-spacing:.1em;
    text-transform:uppercase;
    font-weight:700;
    list-style:none;
  }
  details.advanced summary::-webkit-details-marker{display:none;}
  details.advanced summary::before{
    content:"+ ";
  }
  details.advanced[open] summary::before{
    content:"– ";
  }
  details.advanced summary:hover{color:var(--mist);}
</style>
</head>
<body>
  <header class="cover">
    <div class="wrap">
      <h1>ひとりで泊まれる高級温泉宿</h1>
    </div>
  </header>

<div class="wrap">

  <section class="panel">
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));">
      <div>
        <label>都道府県</label>
        <select id="prefSelect">
          <option value="">接続設定を入力してください</option>
        </select>
      </div>
      <div>
        <label>地区</label>
        <select id="areaSmallSelect"><option value="">読み込み中…</option></select>
      </div>
      <div id="detailSelectWrap" style="display:none;">
        <label>細かいエリア</label>
        <select id="areaDetailSelect"><option value="">指定なし</option></select>
      </div>
      <div>
        <label>チェックイン</label>
        <input type="date" id="checkin">
      </div>
      <div>
        <label>チェックアウト</label>
        <input type="date" id="checkout">
      </div>
    </div>

    <div class="actions">
      <button id="runBtn">検索する</button>
      <span class="status" id="statusMsg">接続設定から始めてください</span>
    </div>

    <details class="advanced">
      <summary>詳細条件</summary>
      <div class="grid" style="margin-top:14px;">
        <div>
          <label>評価で絞り込む</label>
          <select id="minReview">
            <option value="">指定なし</option>
            <option value="3.0">★3.0以上</option>
            <option value="3.5">★3.5以上</option>
            <option value="4.0" selected>★4.0以上</option>
            <option value="4.5">★4.5以上</option>
          </select>
        </div>
        <div>
          <label>最低レビュー件数</label>
          <input type="text" id="minReviewCount" value="30" placeholder="例：30">
        </div>
      </div>
    </details>

    <details class="advanced">
      <summary>接続設定（初回のみ）</summary>
      <div class="grid" style="margin-top:14px;">
        <div>
          <label>楽天アプリID</label>
          <input type="text" id="appId" placeholder="webservice.rakuten.co.jpで取得">
        </div>
        <div>
          <label>アクセスキー</label>
          <input type="text" id="accessKey" placeholder="アプリID発行時のもの">
        </div>
        <div>
          <label>地区一覧</label>
          <button type="button" id="loadAreaBtn" style="width:100%;">再読込</button>
        </div>
      </div>
    </details>

    <details class="advanced">
      <summary>この検索について</summary>
      <div class="legend" style="border-top:none; margin-top:10px; padding-top:0;">
        施設名のリンクは、検索条件が反映された安全なプラン一覧ページを開きます（決済画面には進みません）。<br>
        「特徴」は、プラン名・部屋名に記載がある場合のみタグを表示します（客室露天風呂・離れ・個室食・源泉かけ流し）。表示が無くても「無い」と確定した訳ではなく、確認できなかったという意味です。
      </div>
    </details>
  </section>

  <section class="panel" id="resultsPanel" style="display:none;">
    <h2>検索結果（この条件で泊まれる宿）</h2>
    <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th>施設</th>
            <th>エリア</th>
            <th class="num">価格</th>
            <th>特徴</th>
            <th class="num">評価</th>
          </tr>
        </thead>
        <tbody id="resultsBody"></tbody>
      </table>
    </div>
  </section>

  <div class="empty" id="emptyMsg">条件を入力して検索してください。</div>

</div>

<script>
// 全国対応のため、都道府県は固定リストを持たず、地区一覧APIが実際に返してきたコードから動的に生成する

function fmt(d){ return d.toISOString().slice(0,10); }
const t1 = new Date(); t1.setDate(t1.getDate()+1);
const t2 = new Date(); t2.setDate(t2.getDate()+2);
document.getElementById('checkin').value = fmt(t1);
document.getElementById('checkout').value = fmt(t2);

document.getElementById('checkin').addEventListener('change', ()=>{
  const checkinEl = document.getElementById('checkin');
  const checkoutEl = document.getElementById('checkout');
  const inDate = new Date(checkinEl.value);
  const minOut = new Date(inDate); minOut.setDate(minOut.getDate()+1);
  checkoutEl.min = fmt(minOut);
  const outDate = new Date(checkoutEl.value);
  if(!checkoutEl.value || isNaN(outDate.getTime()) || outDate <= inDate){
    checkoutEl.value = fmt(minOut);
  }
});

(async()=>{
  try{
    const r = await window.storage.get('rakuten-app-id', false);
    if(r && r.value) document.getElementById('appId').value = r.value;
  }catch(e){}
  try{
    const cached = await window.storage.get('rakuten-area-tree', false);
    if(cached && cached.value){
      const tree = JSON.parse(cached.value);
      populatePrefSelect(tree);
    }
  }catch(e){ /* キャッシュなし、初回は読み込みボタンで取得 */ }
})();

function jsonp(url){
  return new Promise((resolve, reject)=>{
    const cbName = 'cb_' + Math.random().toString(36).slice(2);
    const script = document.createElement('script');
    let done = false;
    window[cbName] = (data)=>{ done = true; resolve(data); cleanup(); };
    function cleanup(){ delete window[cbName]; script.remove(); }
    script.onerror = ()=>{
      if(!done){ reject(new Error('通信に失敗しました（アプリIDや通信環境を確認してください）')); cleanup(); }
    };
    setTimeout(()=>{ if(!done){ reject(new Error('タイムアウトしました')); cleanup(); } }, 15000);
    script.src = url + '&callback=' + cbName;
    document.body.appendChild(script);
  });
}

async function apiFetch(url){
  try{
    const res = await fetch(url, { method:'GET' });
    const text = await res.text();
    let data;
    try{ data = JSON.parse(text); }
    catch(parseErr){ throw new Error(`fetchは通ったが応答がJSONではありません（HTTP ${res.status}）`); }
    if(!res.ok || data.error){
      throw new Error(`HTTP ${res.status} ${data.error || ''} ${data.error_description || ''}`.trim());
    }
    return data;
  }catch(fetchErr){
    console.warn('fetch失敗、JSONPにフォールバック:', fetchErr.message);
  }
  const data = await jsonp(url);
  if(data && data.error){
    throw new Error(`[JSONP] ${data.error}: ${data.error_description || ''}`);
  }
  return data;
}

async function apiFetchWithRetry(url, onRetry){
  try{
    return await apiFetch(url);
  }catch(firstErr){
    if(onRetry) onRetry();
    await new Promise(r=>setTimeout(r, 800));
    try{
      return await apiFetch(url);
    }catch(secondErr){
      throw new Error(secondErr.message + '（自動リトライ後も失敗）');
    }
  }
}

// ---- 地区コードAPI（GetAreaClass）まわり ----

function parseAreaTree(data){
  // 実際のレスポンス構造：largeClasses[]の各要素に直接middleClassCode等が入るフラット型
  // （largeClass/middleClass配列でラップされる古い形式ではなかった）
  const result = {};
  const largeClasses = (data.areaClasses && data.areaClasses.largeClasses) || [];
  largeClasses.forEach(lc=>{
    (lc.middleClasses||[]).forEach(mc=>{
      const smalls = (mc.smallClasses||[])
        .map(sc=>({
          code: sc.smallClassCode,
          name: sc.smallClassName,
          details: (sc.detailClasses||[]).map(d=>({code: d.detailClassCode, name: d.detailClassName}))
        }))
        .filter(s=>s.code);
      if(mc.middleClassCode) result[mc.middleClassCode] = { name: mc.middleClassName, smalls };
    });
  });
  return result;
}

function populateSmallSelect(tree){
  window.__areaTree = tree;
  const prefCode = document.getElementById('prefSelect').value;
  const smallSel = document.getElementById('areaSmallSelect');
  smallSel.innerHTML = '';
  const entry = tree[prefCode];
  if(!entry || !entry.smalls || entry.smalls.length===0){
    smallSel.innerHTML = '<option value="">この県の地区が見つかりませんでした</option>';
    onAreaSmallChange();
    return;
  }
  const allOpt = document.createElement('option');
  allOpt.value = '';
  allOpt.textContent = '指定なし（県全体を検索）';
  smallSel.appendChild(allOpt);
  entry.smalls.forEach(s=>{
    const opt = document.createElement('option');
    opt.value = s.code;
    opt.textContent = s.name;
    smallSel.appendChild(opt);
  });
  onAreaSmallChange();
}

function updateDetailSelect(){
  const prefCode = document.getElementById('prefSelect').value;
  const smallCode = document.getElementById('areaSmallSelect').value;
  const wrap = document.getElementById('detailSelectWrap');
  const detailSel = document.getElementById('areaDetailSelect');
  detailSel.innerHTML = '<option value="">指定なし（地区全体）</option>';

  const tree = window.__areaTree;
  if(!tree || !tree[prefCode]) { wrap.style.display = 'none'; return; }
  const smallEntry = tree[prefCode].smalls.find(s=>s.code===smallCode);
  if(!smallEntry || !smallEntry.details || smallEntry.details.length===0){
    wrap.style.display = 'none';
    return;
  }
  smallEntry.details.forEach(d=>{
    const opt = document.createElement('option');
    opt.value = d.code;
    opt.textContent = d.name;
    detailSel.appendChild(opt);
  });
  wrap.style.display = 'block';
}

async function loadAreaTree(){
  const appId = document.getElementById('appId').value.trim();
  const accessKey = document.getElementById('accessKey').value.trim();
  const statusMsg = document.getElementById('statusMsg');
  const loadBtn = document.getElementById('loadAreaBtn');

  if(!appId || !accessKey){
    statusMsg.className='status err';
    statusMsg.textContent = '地区一覧の読み込みにも、アプリID・アクセスキーが必要です';
    return;
  }

  loadBtn.disabled = true;
  statusMsg.className='status';
  statusMsg.textContent = '地区一覧を読み込み中…（全国分なので少し時間がかかります）';

  try{
    const url = `https://openapi.rakuten.co.jp/engine/api/Travel/GetAreaClass/20140210?applicationId=${encodeURIComponent(appId)}&accessKey=${encodeURIComponent(accessKey)}&format=json&formatVersion=2`;
    const data = await apiFetchWithRetry(url, ()=>{ statusMsg.textContent = '接続しています…'; });
    const tree = parseAreaTree(data);

    const prefCodes = Object.keys(tree);
    console.log('地区コードAPIで実際に取得できた都道府県コード一覧:', prefCodes);
    if(prefCodes.length === 0){
      console.log('地区コードAPI 生データ（調査用・先頭3000文字）:', JSON.stringify(data).slice(0,3000));
      statusMsg.className='status err';
      statusMsg.textContent = '都道府県データが見つかりませんでした。開発者コンソールに生データを出力したので確認してください。';
      loadBtn.disabled = false;
      return;
    }

    try{ await window.storage.set('rakuten-area-tree', JSON.stringify(tree), false); }catch(e){}
    populatePrefSelect(tree);
    statusMsg.textContent = '地区一覧を読み込みました。このまま「検索する」を押せます（絞りたい場合は「地区」欄で選び直してください）。';
  }catch(err){
    statusMsg.className='status err';
    statusMsg.textContent = 'エラー: ' + err.message;
  }finally{
    loadBtn.disabled = false;
  }
}

function populatePrefSelect(tree){
  window.__areaTree = tree;
  const prefSel = document.getElementById('prefSelect');
  const prevValue = prefSel.value;
  prefSel.innerHTML = '';
  // 実際にAPIが返してきた都道府県コード・表示名をそのまま使う（コード名を手打ちで推測しない）
  Object.keys(tree).forEach(code=>{
    const opt = document.createElement('option');
    opt.value = code;
    opt.textContent = tree[code].name;
    prefSel.appendChild(opt);
  });
  // 前回選んでいた都道府県があれば維持する
  if(prevValue && tree[prevValue]) prefSel.value = prevValue;
  populateSmallSelect(tree);
}

function onAreaSmallChange(){
  updateDetailSelect();
}

document.getElementById('prefSelect').addEventListener('change', async ()=>{
  if(window.__areaTree){
    populateSmallSelect(window.__areaTree);
  } else {
    const appId = document.getElementById('appId').value.trim();
    const accessKey = document.getElementById('accessKey').value.trim();
    if(appId && accessKey){
      await loadAreaTree(); // キャッシュが無ければ自動で読み込みに行く
    }
  }
});
document.getElementById('areaSmallSelect').addEventListener('change', onAreaSmallChange);
document.getElementById('loadAreaBtn').addEventListener('click', loadAreaTree);
document.getElementById('accessKey').addEventListener('blur', async ()=>{
  const appId = document.getElementById('appId').value.trim();
  const accessKey = document.getElementById('accessKey').value.trim();
  if(appId && accessKey && !window.__areaTree){
    await loadAreaTree();
  }
});
document.getElementById('appId').addEventListener('blur', async ()=>{
  const appId = document.getElementById('appId').value.trim();
  const accessKey = document.getElementById('accessKey').value.trim();
  if(appId && accessKey && !window.__areaTree){
    await loadAreaTree();
  }
});

// ---- 空室検索API（VacantHotelSearch）まわり ----

function buildSearchUrl(params){
  const base = 'https://openapi.rakuten.co.jp/engine/api/Travel/VacantHotelSearch/20170426?';
  const qs = Object.entries(params).filter(([k,v])=>v!==undefined && v!==null && v!=='')
    .map(([k,v])=>`${k}=${encodeURIComponent(v)}`).join('&');
  return base + qs;
}

async function searchOnce(prefCode, smallCode, detailCode, checkin, checkout, appId, accessKey, onsenOnly, minCharge, maxCharge){
  const params = {
    applicationId: appId,
    accessKey: accessKey,
    format: 'json',
    formatVersion: 2,
    largeClassCode: 'japan',
    middleClassCode: prefCode,
    smallClassCode: smallCode,
    checkinDate: checkin,
    checkoutDate: checkout,
    adultNum: 1,
    roomNum: 1,
    searchPattern: 1,
    responseType: 'middle',
    hits: 30,
    page: 1,
    sort: '+roomCharge'
  };
  if(detailCode) params.detailClassCode = detailCode;
  if(onsenOnly) params.squeezeCondition = 'onsen';
  if(minCharge) params.minCharge = minCharge;
  if(maxCharge) params.maxCharge = maxCharge;
  const url = buildSearchUrl(params);
  return await apiFetch(url);
}

async function searchWithRetry(prefCode, smallCode, detailCode, checkin, checkout, appId, accessKey, onsenOnly, minCharge, maxCharge, onRetry){
  const delays = [800, 1600, 3000]; // 段階的に間隔を伸ばす（アクセス制限対策）
  let lastErr;
  for(let i=0; i<=delays.length; i++){
    try{
      return await searchOnce(prefCode, smallCode, detailCode, checkin, checkout, appId, accessKey, onsenOnly, minCharge, maxCharge);
    }catch(err){
      lastErr = err;
      if(i < delays.length){
        if(onRetry) onRetry(i+1, delays.length+1);
        await new Promise(r=>setTimeout(r, delays[i]));
      }
    }
  }
  throw new Error(lastErr.message + `（${delays.length+1}回試しましたが失敗しました）`);
}

function buildConditionAwarePlanUrl(hotelNo, prefCode, smallCode, checkinISO, checkoutISO){
  if(!hotelNo || !checkinISO || !checkoutISO) return null;
  const c1 = checkinISO.split('-').map(s=>parseInt(s,10));
  const c2 = checkoutISO.split('-').map(s=>parseInt(s,10));
  if(c1.length!==3 || c2.length!==3) return null;
  const [y1, m1, d1] = c1;
  const [y2, m2, d2] = c2;
  const params = {
    f_flg: 'PLAN', f_teikei: '', f_hizuke: '', f_hak: '',
    f_dai: 'japan', f_chu: prefCode || '', f_shou: smallCode || '',
    f_sai: '', f_tel: '', f_target_flg: '', f_tscm_flg: '',
    f_p_no: '', f_custom_code: '', f_search_type: '', f_camp_id: '',
    f_static: '1', f_rm_equip: '',
    f_hi1: d1, f_tuki1: m1, f_nen1: y1,
    f_hi2: d2, f_tuki2: m2, f_nen2: y2,
    f_heya_su: '1', f_otona_su: '1',
    f_s1: '0', f_s2: '0', f_y1: '0', f_y2: '0', f_y3: '0', f_y4: '0',
    f_kin2: '0', f_kin: ''
  };
  const qs = Object.entries(params).map(([k,v])=>`${k}=${encodeURIComponent(v)}`).join('&');
  return `https://hotel.travel.rakuten.co.jp/hotelinfo/plan/${hotelNo}?${qs}`;
}

function toHalfWidthDigits(s){
  return (s||'').replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
}

function extractStationWalk(accessText){
  const t = toHalfWidthDigits(accessText);
  // 括弧は空白に置換してから駅名を探す（隣の駅名同士がくっつくのを防ぐ）
  const stripped = t.replace(/[「」()（）]/g, ' ');
  const stationMatch = stripped.match(/([A-Za-z0-9ぁ-んァ-ヴー一-龠]{1,12}駅)/);
  if(!stationMatch) return null;
  const stationName = stationMatch[1];
  const idx = stripped.indexOf(stationMatch[0]);
  const window = stripped.slice(idx, idx+40);
  const walkMatch = window.match(/徒歩\D{0,5}?(\d+)\s*分/);
  if(!walkMatch) return null;
  return { station: stationName, minutes: walkMatch[1] };
}

function hasRotenburo(roomName, planName){
  const text = `${roomName||''} ${planName||''}`;
  // プラン名・部屋名に施設側が明記している表記のみを拾う（誤検知を避けるため自由文は見ない）
  return /露天風呂(付|つき|附)|客室露天|離れ.{0,5}露天|専用露天/.test(text);
}
function hasHanare(roomName, planName){
  const text = `${roomName||''} ${planName||''}`;
  return /離れ/.test(text);
}
function hasKoshitsuShoku(roomName, planName){
  const text = `${roomName||''} ${planName||''}`;
  return /個室食|個室でのお食事|お部屋食|部屋食/.test(text);
}
function hasKakenagashi(roomName, planName){
  const text = `${roomName||''} ${planName||''}`;
  return /源泉かけ流し|源泉掛け流し|かけ流し|掛け流し/.test(text);
}

function dedupeByHotel(rows){
  const map = new Map();
  rows.forEach(r=>{
    const flags = {
      rotenburo: hasRotenburo(r.roomName, r.planName),
      hanare: hasHanare(r.roomName, r.planName),
      koshitsuShoku: hasKoshitsuShoku(r.roomName, r.planName),
      kakenagashi: hasKakenagashi(r.roomName, r.planName),
    };
    const existing = map.get(r.hotelNo);
    if(!existing){
      map.set(r.hotelNo, {...r, features: flags});
    } else {
      const mergedFlags = {
        rotenburo: existing.features.rotenburo || flags.rotenburo,
        hanare: existing.features.hanare || flags.hanare,
        koshitsuShoku: existing.features.koshitsuShoku || flags.koshitsuShoku,
        kakenagashi: existing.features.kakenagashi || flags.kakenagashi,
      };
      if(r.total < existing.total){
        map.set(r.hotelNo, {...r, features: mergedFlags});
      } else {
        existing.features = mergedFlags;
      }
    }
  });
  return Array.from(map.values()).sort((a,b)=> (a.areaIndex??0) - (b.areaIndex??0) || a.hotelName.localeCompare(b.hotelName, 'ja'));
}

function mealText(room){
  if(!room) return '不明';
  const b = room.withBreakfastFlag===1 ? '朝食○' : '朝食×';
  const d = room.withDinnerFlag===1 ? '夕食○' : '夕食×';
  return b + ' / ' + d;
}

function extractRows(data){
  const rows = [];
  if(!data || !data.hotels) return rows;

  data.hotels.forEach(hotelEntry=>{
    const nodes = Array.isArray(hotelEntry) ? hotelEntry : [hotelEntry];
    let basic=null, roomInfoArr=null;
    nodes.forEach(node=>{
      if(node.hotelBasicInfo) basic = node.hotelBasicInfo;
      if(node.roomInfo) roomInfoArr = node.roomInfo;
    });
    if(!basic) return;

    let room=null, daily=null;
    if(Array.isArray(roomInfoArr)){
      roomInfoArr.forEach(rn=>{
        if(rn.roomBasicInfo) room = rn.roomBasicInfo;
        if(rn.dailyCharge) daily = rn.dailyCharge;
      });
    }
    if(!daily || daily.total===null || daily.total===undefined) return;

    rows.push({
      hotelNo: basic.hotelNo,
      hotelName: basic.hotelName,
      url: basic.hotelInformationUrl,
      planListUrl: basic.planListUrl,
      reserveUrl: room ? room.reserveUrl : null,
      reviewAverage: basic.reviewAverage,
      reviewCount: basic.reviewCount,
      access: basic.access,
      stationWalk: extractStationWalk(basic.access),
      roomName: room ? room.roomName : '(部屋情報なし)',
      planName: room ? room.planName : '',
      meal: mealText(room),
      total: daily.total,
      chargeFlag: daily.chargeFlag,
    });
  });
  return rows.sort((a,b)=>a.total-b.total);
}

function yen(n){
  if(n===null || n===undefined) return '—';
  return '¥' + Number(n).toLocaleString('ja-JP');
}

async function runSearch(){
  const appId = document.getElementById('appId').value.trim();
  const accessKey = document.getElementById('accessKey').value.trim();
  const prefCode = document.getElementById('prefSelect').value;
  const smallCode = document.getElementById('areaSmallSelect').value;
  const detailCode = document.getElementById('areaDetailSelect').value;
  const checkin = document.getElementById('checkin').value;
  const checkout = document.getElementById('checkout').value;
  const onsenOnly = true; // このページは常に温泉宿限定
  const LUXURY_MIN_CHARGE = '50000'; // 「高級」の基準はサイト側で固定・非公開（ユーザーには見せない・選ばせない）
  const minCharge = LUXURY_MIN_CHARGE;
  const maxCharge = ''; // 価格帯上限はUIから削除（非公開）
  const minReview = parseFloat(document.getElementById('minReview').value) || 0;
  const minReviewCount = parseInt(document.getElementById('minReviewCount').value) || 0;
  const statusMsg = document.getElementById('statusMsg');
  const runBtn = document.getElementById('runBtn');

  if(!appId){ statusMsg.textContent = 'アプリIDを入力してください'; statusMsg.className='status err'; return; }
  if(!accessKey){ statusMsg.textContent = 'アクセスキーを入力してください'; statusMsg.className='status err'; return; }
  if(!window.__areaTree){
    // まだ地区一覧が読み込まれていなければ、エラーにせずここで待って読み込む
    statusMsg.className = 'status loading';
    statusMsg.textContent = '地区一覧を準備中…';
    await loadAreaTree();
    if(!window.__areaTree){
      statusMsg.textContent = '地区一覧の読み込みに失敗しました。もう一度「検索する」を押してください';
      statusMsg.className='status err';
      return;
    }
  }
  if(!checkin || !checkout){ statusMsg.textContent = '日付を指定してください'; statusMsg.className='status err'; return; }
  if(new Date(checkout) <= new Date(checkin)){
    statusMsg.textContent = `チェックアウト日（${checkout}）がチェックイン日（${checkin}）以前になっています。チェックアウトをチェックインより後の日付にしてください`;
    statusMsg.className='status err';
    return;
  }

  runBtn.disabled = true;
  runBtn.textContent = '検索中… ⏳';
  statusMsg.className = 'status loading';
  statusMsg.textContent = '検索中…';

  try{ await window.storage.set('rakuten-app-id', appId, false); }catch(e){}

  try{
    let rows = [];
    let beforeFilterCount = 0;
    let apiCount = '不明';

    if(!smallCode){
      // 「県全体」：その県の全地区を順番に検索して合算する。各行にエリア名を付与する
      const smallsToSearch = (window.__areaTree[prefCode] && window.__areaTree[prefCode].smalls) || [];
      let totalHit = 0;
      for(let i=0; i<smallsToSearch.length; i++){
        const sc = smallsToSearch[i];
        statusMsg.textContent = `県全体を検索中…（${i+1}/${smallsToSearch.length}：${sc.name}）`;
        try{
          const data = await searchWithRetry(prefCode, sc.code, '', checkin, checkout, appId, accessKey, onsenOnly, minCharge, maxCharge,
            (attempt, total)=>{ statusMsg.textContent = `${sc.name}の空室を確認しています…`; });
          const extracted = extractRows(data).map(r => ({...r, areaName: sc.name, smallCodeUsed: sc.code, areaIndex: i}));
          rows = rows.concat(extracted);
          if(data && data.pagingInfo && data.pagingInfo.recordCount!==undefined) totalHit += data.pagingInfo.recordCount;
        }catch(e){
          console.warn(`${sc.name}の検索に失敗、スキップします:`, e.message);
        }
        await new Promise(r=>setTimeout(r, 1200)); // 連続アクセスを避けるための小休止
      }
      beforeFilterCount = rows.length;
      apiCount = totalHit;
    } else {
      const data = await searchWithRetry(prefCode, smallCode, detailCode, checkin, checkout, appId, accessKey, onsenOnly, minCharge, maxCharge,
        (attempt, total)=>{ statusMsg.textContent = `空室を確認しています…`; });
      const areaName = document.getElementById('areaSmallSelect').selectedOptions[0]?.textContent || smallCode;
      rows = extractRows(data).map(r => ({...r, areaName, smallCodeUsed: smallCode, areaIndex: 0}));
      beforeFilterCount = rows.length;
      apiCount = (data && data.pagingInfo && data.pagingInfo.recordCount!==undefined) ? data.pagingInfo.recordCount : '不明';
    }

    // APIのminChargeは施設単位の目安に対してかかっている可能性があり、
    // その日程の実際の価格(total)を保証しないため、ここでもう一度確実に絞り込む
    const minChargeNum = parseInt(minCharge, 10);
    if(!isNaN(minChargeNum)){ rows = rows.filter(r => r.total >= minChargeNum); }
    if(minReview > 0 || minReviewCount > 0){
      rows = rows.filter(r => (r.reviewAverage||0) >= minReview && (r.reviewCount||0) >= minReviewCount);
    }
    // 施設単位の視点にするため、同じ宿は1件にまとめ、条件を満たす中で一番安いプランを代表とする
    rows = dedupeByHotel(rows);
    const areaLabel = smallCode
      ? (document.getElementById('areaSmallSelect').selectedOptions[0]?.textContent || smallCode)
      : `${document.getElementById('prefSelect').selectedOptions[0]?.textContent}全体`;

    renderRows(rows.map(r => ({...r, conditionUrl: buildConditionAwarePlanUrl(r.hotelNo, prefCode, r.smallCodeUsed, checkin, checkout)})), areaLabel);
    statusMsg.className = 'status';
    statusMsg.textContent = `${areaLabel}：APIヒット数=${apiCount}件（プラン単位） ／ 条件を満たす宿=${rows.length}件（${checkin}〜${checkout}）`;
    if(beforeFilterCount > 0 && rows.length === 0){
      statusMsg.textContent += ' ※評価・件数の基準で全て除外されました。基準を緩めてもう一度お試しください。';
    }
  }catch(err){
    statusMsg.className = 'status err';
    statusMsg.textContent = 'エラー: ' + err.message;
  }finally{
    // 連打による短時間集中アクセスを防ぐため、1.5秒はボタンを無効化する
    setTimeout(()=>{ runBtn.disabled = false; runBtn.textContent = '検索する'; }, 1500);
  }
}

function renderRows(rows, areaLabel){
  const panel = document.getElementById('resultsPanel');
  const empty = document.getElementById('emptyMsg');
  const tbody = document.getElementById('resultsBody');
  tbody.innerHTML = '';

  if(rows.length === 0){
    panel.style.display='none';
    empty.style.display='block';
    empty.textContent = areaLabel + ' で、指定条件・大人1名では該当する温泉宿が見つかりませんでした。価格帯の下限を下げるか、評価の基準を緩めて試してください。';
    return;
  }
  empty.style.display='none';
  panel.style.display='block';

  const failedWalks = rows.filter(r=>!r.stationWalk && r.access).slice(0,5);
  if(failedWalks.length > 0){
    console.log('駅徒歩分数を抽出できなかった宿のアクセス文（調査用・最大5件）:',
      failedWalks.map(r=>({施設名:r.hotelName, アクセス文:r.access})));
  }

  rows.forEach(r=>{
    const tr = document.createElement('tr');
    const featureLabels = [];
    if(r.features){
      if(r.features.rotenburo) featureLabels.push('客室露天風呂');
      if(r.features.hanare) featureLabels.push('離れ');
      if(r.features.koshitsuShoku) featureLabels.push('個室食');
      if(r.features.kakenagashi) featureLabels.push('源泉かけ流し');
    }
    const featureCell = featureLabels.length
      ? featureLabels.map(f=>`<span class="badge">${f}</span>`).join(' ')
      : '<span style="color:var(--mist);">—</span>';
    tr.innerHTML = `
      <td class="hname"><a href="${r.conditionUrl || r.planListUrl || r.url}" target="_blank" rel="noopener">${r.hotelName}</a></td>
      <td>${r.areaName || '—'}</td>
      <td class="num">${yen(r.total)}〜</td>
      <td>${featureCell}</td>
      <td class="num">${r.reviewAverage!==undefined && r.reviewAverage!==null ? '★'+r.reviewAverage+' ('+(r.reviewCount||0)+')' : '—'}</td>
    `;
    tbody.appendChild(tr);
  });
}

document.getElementById('runBtn').addEventListener('click', runSearch);
</script>
</body>
